<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>麻雀戦績管理</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#1b5e3a" />

  <!-- iPhoneのホーム画面に追加したときの設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="麻雀戦績" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" href="./icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="app-header">
    <img src="./icon-192.png" alt="" />
    <h1>麻雀戦績管理</h1>
  </header>

  <main>
    <section id="screen-input" class="screen"></section>
    <section id="screen-history" class="screen" hidden></section>
    <section id="screen-stats" class="screen" hidden></section>
    <section id="screen-settings" class="screen" hidden></section>
  </main>

  <nav class="bottom-nav">
    <button type="button" class="nav-btn active" data-tab="input">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 4.5l4 4L8 20H4v-4L15.5 4.5z"/></svg></span><span>入力</span>
    </button>
    <button type="button" class="nav-btn" data-tab="history">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h10a3 3 0 0 1 3 3v13H8a2 2 0 0 1-2-2V4z"/><path d="M6 4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/></svg></span><span>履歴</span>
    </button>
    <button type="button" class="nav-btn" data-tab="stats">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="13" width="4" height="7" rx="1"/><rect x="10" y="8" width="4" height="12" rx="1"/><rect x="16" y="3" width="4" height="17" rx="1"/></svg></span><span>成績</span>
    </button>
    <button type="button" class="nav-btn" data-tab="settings">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.97 7.97 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a8 8 0 0 0-1.7-1L14.9 3h-4l-.4 2.6a8 8 0 0 0-1.7 1l-2.5-1-2 3.4L6.4 11a7.97 7.97 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a8 8 0 0 0 1.7 1l.4 2.6h4l.4-2.6a8 8 0 0 0 1.7-1l2.5 1 2-3.4L19.4 13z"/></svg></span><span>設定</span>
    </button>
  </nav>

  <div id="toast" hidden></div>
  <button id="export-btn" hidden></button>
  <input type="file" id="import-input" accept="application/json" />

  <script src="./icons.js"></script>
  <script src="./storage.js"></script>
  <script src="./calc.js"></script>
  <script src="./charts.js"></script>
  <script src="./app.js"></script>
</body>
</html>
